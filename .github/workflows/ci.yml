name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: go mod tidy
        run: go mod tidy -diff
      - name: go test
        run: go test ./...
      - name: go vet
        run: go vet ./...
      - name: go build
        run: go build ./cmd/mediadetect
      - name: no private dependency
        shell: bash
        run: |
          if go list -deps ./cmd/mediadetect \
            | grep '^github.com/dream-365/' \
            | grep -v '^github.com/dream-365/MediaDetect'; then
            echo "private dependency detected"
            exit 1
          fi
      - name: boundary
        shell: bash
        run: |
          set -euo pipefail
          public_count=$(go list ./... | grep -v '/internal/' | wc -l | tr -d ' ')
          test "$public_count" -eq 6
          internal_count=$(go list ./... | grep '/internal/' | wc -l | tr -d ' ')
          test "$internal_count" -eq 2
          if go list -f '{{.ImportPath}}: {{join .Imports " "}}' ./parser ./probe ./tmdb ./matcher | grep '/internal/'; then
            echo "domain package imports internal"
            exit 1
          fi
          if grep -Eq '"github.com/dream-365/MediaDetect/(probe|matcher)"' result.go; then
            echo "result.go imports probe/matcher"
            exit 1
          fi

          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          cd "$tmp"
          go mod init example.com/internal-probe
          go mod edit -replace "github.com/dream-365/MediaDetect=${GITHUB_WORKSPACE}"
          go mod edit -require github.com/dream-365/MediaDetect@v0.2.0

          for pkg in collect llm; do
            printf '%s\n' 'package main' '' "import _ \"github.com/dream-365/MediaDetect/internal/${pkg}\"" '' 'func main() {}' > main.go
            if output=$(GOFLAGS=-mod=mod go build ./... 2>&1); then
              echo "external import of internal/${pkg} unexpectedly succeeded"
              exit 1
            fi
            printf '%s\n' "$output" | grep -q 'use of internal package'
          done
